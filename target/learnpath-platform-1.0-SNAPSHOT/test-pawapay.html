<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test API PawaPay</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
            background: #f5f6fa;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            margin-bottom: 20px;
        }
        h2 { color: #1a1a2e; margin-top: 0; }
        label { display: block; font-weight: 600; margin: 12px 0 4px; color: #555; }
        input, textarea, select {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #e8eaef;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            box-sizing: border-box;
        }
        textarea { height: 200px; font-family: 'Courier New', monospace; font-size: 12px; }
        button {
            padding: 14px 28px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 14px;
            transition: all 0.3s ease;
        }
        button:hover { background: #5a6fd6; transform: translateY(-2px); }
        .response { 
            background: #1e1e2e; 
            color: #cdd6f4; 
            padding: 16px; 
            border-radius: 10px; 
            font-family: 'Courier New', monospace; 
            font-size: 12px; 
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
        }
        .success { color: #27ae60; }
        .error { color: #e74c3c; }
        .info { color: #667eea; }
    </style>
</head>
<body>

<div class="card">
    <h2>🧪 Test API PawaPay - Création de dépôt</h2>
    
    <label>Token API (Bearer)</label>
    <textarea id="token" placeholder="Colle ton token JWT ici...">eyJraWQiOiIxIiwiYWxnIjoiRVMyNTYifQ.eyJ0dCI6IkFBVCIsInN1YiI6IjIxOTUwIiwibWF2IjoiMSIsImV4cCI6MjA5NTM0Nzg2MywiaWF0IjoxNzc5NzI4NjYzLCJwbSI6IkRBRixQQUYiLCJqdGkiOiI5OGNhM2NlZi1hMjFlLTQ0MTQtYTZjZi04ZTlhYzk3YzY5MjYifQ.z_yAgeH6jADRDor7q2JIuFD2409xrPzuPBez1vnEYLimSWPGuSKfTH3QtjA08cBhPbrnbi61_F00kW_qThxDSg</textarea>

    <label>URL API</label>
    <input type="text" id="apiUrl" value="https://api.sandbox.pawapay.io/deposits">

    <label>Référence (depositId)</label>
    <input type="text" id="depositId" value="TEST-JS-001">

    <label>Montant (USD)</label>
    <input type="text" id="amount" value="4.00">

    <label>Devise</label>
    <input type="text" id="currency" value="USD">

    <label>Téléphone (MSISDN)</label>
    <input type="text" id="phone" value="+243984270438">

    <button onclick="testPawaPay()">
        🚀 Envoyer la requête
    </button>
    <button onclick="testAvecDifférentsFormats()" style="background: #f39c12; margin-left: 10px;">
        🔄 Tester tous les formats
    </button>
</div>

<div class="card" id="resultCard" style="display: none;">
    <h3>📤 Résultat</h3>
    <div class="response" id="response"></div>
</div>

<script>
    async function testPawaPay() {
        var token = document.getElementById('token').value.trim();
        var apiUrl = document.getElementById('apiUrl').value.trim();
        var depositId = document.getElementById('depositId').value.trim();
        var amount = document.getElementById('amount').value.trim();
        var currency = document.getElementById('currency').value.trim();
        var phone = document.getElementById('phone').value.trim();

        if (!token || !apiUrl || !depositId || !amount || !phone) {
            alert('Tous les champs sont obligatoires !');
            return;
        }

        var body = {
            depositId: depositId,
            amount: amount,
            currency: currency,
            correspondent: {
                type: "MSISDN",
                msisdn: phone
            }
        };

        await envoyerRequete(apiUrl, token, body, 'Format de base');
    }

    async function testAvecDifférentsFormats() {
        var token = document.getElementById('token').value.trim();
        var apiUrl = document.getElementById('apiUrl').value.trim();
        var phone = document.getElementById('phone').value.trim();

        if (!token || !apiUrl || !phone) {
            alert('Token, URL et téléphone sont obligatoires !');
            return;
        }

        var formats = [
            {
                nom: 'Format 1 : Minimal',
                body: {
                    depositId: 'TEST-F1-' + Date.now(),
                    amount: '4.00',
                    currency: 'USD',
                    correspondent: { type: 'MSISDN', msisdn: phone }
                }
            },
            {
                nom: 'Format 2 : Avec amount en nombre',
                body: {
                    depositId: 'TEST-F2-' + Date.now(),
                    amount: 4.00,
                    currency: 'USD',
                    correspondent: { type: 'MSISDN', msisdn: phone }
                }
            },
            {
                nom: 'Format 3 : Avec customer',
                body: {
                    depositId: 'TEST-F3-' + Date.now(),
                    amount: '4.00',
                    currency: 'USD',
                    correspondent: { type: 'MSISDN', msisdn: phone },
                    customer: { msisdn: phone }
                }
            },
            {
                nom: 'Format 4 : Sans depositId (juste reference)',
                body: {
                    reference: 'TEST-F4-' + Date.now(),
                    amount: '4.00',
                    currency: 'USD',
                    correspondent: { type: 'MSISDN', msisdn: phone }
                }
            }
        ];

        for (var i = 0; i < formats.length; i++) {
            var f = formats[i];
            document.getElementById('response').innerHTML += 
                '<span class="info">--- ' + f.nom + ' ---</span>\n';
            await envoyerRequete(apiUrl, token, f.body, f.nom);
        }
    }

    async function envoyerRequete(url, token, body, nom) {
        var resultCard = document.getElementById('resultCard');
        var responseDiv = document.getElementById('response');
        resultCard.style.display = 'block';

        responseDiv.innerHTML += '<span class="info">📤 Envoi : ' + nom + '</span>\n';
        responseDiv.innerHTML += 'JSON : ' + JSON.stringify(body, null, 2) + '\n\n';

        try {
            var response = await fetch(url, {
                method: 'POST',
                headers: {
                    'Authorization': 'Bearer ' + token,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(body)
            });

            var status = response.status;
            var responseText = await response.text();

            if (status === 200 || status === 201) {
                responseDiv.innerHTML += '<span class="success">✅ SUCCÈS (HTTP ' + status + ')</span>\n';
                responseDiv.innerHTML += 'Réponse : ' + responseText + '\n\n';
            } else {
                responseDiv.innerHTML += '<span class="error">❌ ERREUR (HTTP ' + status + ')</span>\n';
                responseDiv.innerHTML += 'Réponse : ' + responseText + '\n\n';
            }

        } catch (error) {
            responseDiv.innerHTML += '<span class="error">❌ ERREUR RÉSEAU : ' + error.message + '</span>\n\n';
        }

        responseDiv.scrollTop = responseDiv.scrollHeight;
    }
</script>

</body>
</html>
